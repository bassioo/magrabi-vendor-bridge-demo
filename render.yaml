# One-click deploy on Render (https://render.com). Creates the service with a persistent disk for SQLite + uploads.
services:
  - type: web
    name: magrabi-vendor-hub
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: vendorhub-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: APP_MODE
        value: live
      - key: PUBLIC_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Procurement admin
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WATHQ_API_KEY
        sync: false
